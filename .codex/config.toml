# Native Luna Agent defaults. The installer copies this file to ~/.codex/luna.config.toml.
# Workers inherit the parent conversation's service tier and other live settings.

[features]
multi_agent = true

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"
