[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-agent"
version = "0.3.0"
description = "Run isolated GPT-5.6 Luna workers with per-task speed and reasoning settings."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "bme-lyh" }]
dependencies = []

[project.scripts]
luna-agent = "luna_agent.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
